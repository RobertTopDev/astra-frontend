name: Astra Frontend CI/CD Pipeline

on:
  push:
    branches:
      - mainnet # prod
      - staging 
      - testnet # alpha
      - feature/**
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches:
      - mainnet
      - staging
      - testnet
      - feature/**

jobs:
  sonar-scan:
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout repository on branch: ${{ github.REF }}"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.HEAD_REF }}
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarCloud Scan
        uses: sonarsource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  write-creds-from-secrets:
    name: "Write env from secrets"
    runs-on: ubuntu-latest
    needs: [sonar-scan ]

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Get branch names.
        id: branch-names
        uses: tj-actions/branch-names@v8

      - name: Write testnet from secrets
        if: ${{ steps.branch-names.outputs.ref_branch != 'mainnet' || 'staging' }}
        run: |
          echo "${{ secrets.ENV }}" > .env
        env:
          ENV: ${{ secrets.ENV}}

      - name: Write staging from secrets
        if: ${{ steps.branch-names.outputs.ref_branch == 'staging' }}
        run: |
          echo "${{ secrets.STAGING_ENV }}" > .env
        env:
          ENV: ${{ secrets.STAGING_ENV}}

      - name: Write mainnet env from secrets
        if: ${{ steps.branch-names.outputs.ref_branch == 'mainnet' }}
        run: |
          echo "${{ secrets.MAINNET_ENV }}" > .env
        env:
          ENV: ${{ secrets.MAINNET_ENV}}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: creds-artifact
          path: |
            .env

  docker-build-and-push:
    name: "Docker Build and Push"
    runs-on: ubuntu-latest
    needs: [sonar-scan, write-creds-from-secrets]
    
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: creds-artifact
          path: .

      - name: Get branch names.
        id: branch-names
        uses: tj-actions/branch-names@v8

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GKE_SA_KEY }}

      - name: Build docker image
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev
          BRANCH_NAME=${{ steps.branch-names.outputs.ref_branch }}-${GITHUB_SHA::7}
          SAFE_BRANCH_NAME=${BRANCH_NAME//\//-} # Replace slashes with dashes
          docker build -t us-central1-docker.pkg.dev/tmgalaxy/astra-testnet/astra-frontend:$SAFE_BRANCH_NAME .

      - name: Push image to artifact repository
        if: (github.ref == 'refs/heads/testnet' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/mainnet') && (github.event.pull_request.merged == true || github.event_name == 'push')
        run: |
          BRANCH_NAME=${{ steps.branch-names.outputs.ref_branch }}-${GITHUB_SHA::7}
          SAFE_BRANCH_NAME=${BRANCH_NAME//\//-} # Replace slashes with dashes
          docker push us-central1-docker.pkg.dev/tmgalaxy/astra-testnet/astra-frontend:$SAFE_BRANCH_NAME

  release-to-k8s:
    name: "Release to k8s"
    runs-on: ubuntu-latest
    needs: [docker-build-and-push]

    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud

        uses: google-github-actions/auth@v2
        with:
            credentials_json: ${{ secrets.GKE_SA_KEY }}

      - name: Get branch names.
        id: branch-names
        uses: tj-actions/branch-names@v8

        # get alpha cluster creds
      - name: "Get GKE alpha credentials"
        uses: "google-github-actions/get-gke-credentials@v2"
        with:
            cluster_name: "cluster-alpha-us-central1"
            location: "us-central1"

      - name: Deploy to cluster
        if: (github.ref == 'refs/heads/testnet' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/mainnet') && (github.event.pull_request.merged == true || github.event_name == 'push')
        run: |
            BRANCH_NAME=${{ steps.branch-names.outputs.ref_branch }}-${GITHUB_SHA::7}
            SAFE_BRANCH_NAME=${BRANCH_NAME//\//-}
            helm upgrade --install astra-frontend ./helm/astra-frontend \
            --namespace astra-${{ steps.branch-names.outputs.ref_branch }} --create-namespace \
            --values ./helm/astra-frontend/helmvars/${{ steps.branch-names.outputs.ref_branch }}/values.yaml \
            --set image.tag=$SAFE_BRANCH_NAME \
