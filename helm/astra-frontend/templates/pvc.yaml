apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: astradao-pvc
spec:
  accessModes:
    {{- range .Values.pvc.accessModes }}
        - {{ . | quote }}
    {{- end }}
  resources:
    requests:
      storage: {{ .Values.pvc.size }}
  storageClassName: {{ .Values.pvc.storageClassName }}
