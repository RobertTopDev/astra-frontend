apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  namespace: {{ .Values.backendConfig.namespace }}
  name: astra-backendconfig
spec:
  securityPolicy:
    name: "ddos-policy-alpha-us-central1"
  sessionAffinity:
    affinityType: "CLIENT_IP"
  timeoutSec: 30
  customRequestHeaders:
    headers:
    - "X-Client-Region:{client_region}"
    - "X-Client-City:{client_city}"
    - "X-Client-CityLatLong:{client_city_lat_long}"